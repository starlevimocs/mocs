name: Compilar mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Compilar
        run: gradle build --no-daemon

      - name: Guardar el jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dreams-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publicar en Releases (ultima version)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ultima version
          body: Jar compilado automaticamente desde el ultimo commit de main.
          files: build/libs/*.jar
          prerelease: true
